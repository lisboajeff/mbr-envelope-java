name: Release Maven Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          server-id: github
          server-username: ${{ github.actor }}
          server-password: GITHUB_TOKEN

      - name: Test, PMD & Deploy to GitHub Packages
        run: ./mvnw -B test pmd:check deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
